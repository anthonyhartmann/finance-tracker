<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cline Agent Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root { --pico-spacing: 0.5rem; }
    body { margin: 0; font-size: 13px; }
    .container-fluid { padding-inline: 1rem; }
    .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:.72rem; font-weight:600; color:#fff; white-space:nowrap; }
    .b-running { background:#22c55e; } .b-stale { background:#f97316; } .b-idle { background:#eab308; color:#1a1a1a; }
    .b-completed { background:#6b7280; } .b-failed { background:#ef4444; }
    table td, table th { padding:3px 8px; font-size:.76rem; vertical-align:middle; line-height:1.35; }
    table tbody tr { cursor:pointer; }
    table tbody tr:hover { background:var(--pico-secondary-background); }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.71rem; }
    .muted { color:var(--pico-muted-color); }
    .trivial-hidden { display:none !important; }
    .chat-panel { position:fixed; top:0; right:0; width:48%; max-width:760px; height:100vh; background:var(--pico-background-color); border-left:1px solid var(--pico-muted-border-color); display:flex; flex-direction:column; z-index:1000; box-shadow:-8px 0 30px rgba(0,0,0,.25); }
    .chat-head { padding:.4rem .7rem; border-bottom:1px solid var(--pico-muted-border-color); display:flex; align-items:center; gap:.5rem; }
    .chat-body { flex:1; overflow-y:auto; padding:.5rem; }
    .chat-foot { padding:.4rem .7rem; border-top:1px solid var(--pico-muted-border-color); }
    .msg { margin-bottom:.7rem; max-width:100%; }
    .msg-user { text-align:right; }
    .msg-user .bubble { background:var(--pico-primary-background); color:var(--pico-primary-inverse); display:inline-block; padding:.35rem .6rem; border-radius:.6rem .6rem 0 .6rem; text-align:left; max-width:88%; white-space:pre-wrap; word-break:break-word; }
    .msg-assistant .bubble { background:var(--pico-card-background-color); border:1px solid var(--pico-muted-border-color); display:inline-block; padding:.35rem .6rem; border-radius:.6rem .6rem .6rem 0; max-width:88%; white-space:pre-wrap; word-break:break-word; }
    .msg-tool .bubble { background:transparent; border:1px dashed var(--pico-muted-border-color); display:inline-block; padding:.3rem .5rem; border-radius:.4rem; max-width:88%; font-size:.72rem; }
    .bubble pre { white-space:pre-wrap; word-break:break-word; margin:0; }
    .topbar { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; padding:.5rem 0; }
    .topbar h1 { margin:0; font-size:.95rem; }
    .topbar .right { margin-left:auto; display:flex; align-items:center; gap:1rem; }
    .conn { font-size:.75rem; }
    .conn-ok { color:#22c55e; } .conn-bad { color:#ef4444; }
    details.thinking summary { cursor:pointer; font-size:.75rem; color:var(--pico-muted-color); }
    .scrolly { max-height:340px; overflow:auto; }
    input[type=checkbox] { width:auto; margin:0; }
    .row-id { font-size:.68rem; color:var(--pico-muted-color); }
    .thinking-block { background:var(--pico-secondary-background); border-left:3px solid var(--pico-primary); padding:.35rem .6rem; margin:.25rem 0; border-radius:0 .4rem .4rem 0; }
    .thinking-block .label { font-weight:600; color:var(--pico-primary); font-size:.66rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.15rem; }
    .thinking-block pre { white-space:pre-wrap; word-break:break-word; margin:0; font-size:.71rem; color:var(--pico-muted-color); }
  </style>
</head>
<body>
<main class="container-fluid" x-data="dashboard()" x-init="init()">
  <div class="topbar">
    <h1>🤖 Cline Agent Dashboard</h1>
    <span class="conn" :class="sseOk?'conn-ok':'conn-bad'" x-text="sseOk?'● live':'○ reconnecting'"></span>
    <span class="muted" x-text="sessions.length + ' sessions'"></span>
    <div class="right">
      <label style="margin:0;display:flex;align-items:center;gap:.4rem;font-size:.8rem">
        <input type="checkbox" x-model="hideFailed"> Hide failed
      </label>
      <label style="margin:0;display:flex;align-items:center;gap:.4rem;font-size:.8rem">
        <input type="checkbox" x-model="hideTrivial"> Hide trivial
      </label>
      <label style="margin:0;display:flex;align-items:center;gap:.4rem;font-size:.8rem">
        <input type="checkbox" x-model="dark"> Dark
      </label>
      <button class="secondary outline" @click="refresh()" style="margin:0;padding:.25rem .6rem">↻</button>
    </div>
  </div>

  <figure style="margin:.4rem 0">
    <table>
      <thead><tr>
        <th>Status</th><th>Title / Prompt</th><th>Project</th><th>Model</th><th>Started</th><th>Cost</th><th>Actions</th>
      </tr></thead>
      <tbody>
        <template x-for="s in sortedSessions" :key="s.sessionId">
          <tr :class="(hideTrivial && isTrivial(s)) || (hideFailed && displayStatus(s)==='failed') ? 'trivial-hidden' : ''" @click="openChat(s.sessionId)">
            <td><span class="badge" :class="'b-'+displayStatus(s)" x-text="displayStatus(s)"></span></td>
            <td><span x-text="titleOf(s)"></span><br><span class="row-id mono" x-text="s.sessionId"></span></td>
            <td class="mono" x-text="projOf(s)"></td>
            <td class="mono" x-text="(s.metadata&&s.metadata.model)||'—'"></td>
            <td class="mono" x-text="relTime(s)"></td>
            <td class="mono" x-text="costOf(s)"></td>
            <td @click.stop>
              <button class="outline" style="margin:0;padding:.15rem .5rem;font-size:.72rem" @click="openChat(s.sessionId)">Chat</button>
              <button class="outline" style="margin:0;padding:.15rem .5rem;font-size:.72rem" @click="openTerminal(s.sessionId)">Open</button>
            </td>
          </tr>
        </template>
        <template x-if="sortedSessions.length===0"><tr><td colspan="7" class="muted">No sessions.</td></tr></template>
      </tbody>
    </table>
  </figure>

  <!-- Chat panel -->
  <div class="chat-panel" x-show="chatOpen" x-transition x-cloak>
    <div class="chat-head">
      <strong x-text="chatSession? chatSession.sessionId : ''"></strong>
      <span class="muted" style="font-size:.78rem" x-text="chatSession? titleOf(chatSession) : ''"></span>
      <button class="outline" style="margin-left:auto;padding:.2rem .6rem" @click="closeChat()">✕</button>
    </div>
    <div class="chat-body" x-ref="chatbody">
      <template x-for="m in chatMessages" :key="m.id||($index)">
        <div :class="'msg msg-'+roleOf(m)">
          <div class="bubble">
            <template x-if="roleOf(m)==='assistant'"><small class="muted" x-text="(m.model||'assistant')"></small></template>
            <template x-for="(b,bi) in blocksOf(m)" :key="bi">
              <div>
                <template x-if="b.type==='text'"><pre x-text="b.text"></pre></template>
                <template x-if="b.type==='thinking'"><div class="thinking-block"><div class="label">thinking</div><pre x-text="b.thinking"></pre></div></template>
                <template x-if="b.type==='tool_use'"><div class="mono muted">🔨 <strong x-text="b.name"></strong> <span x-text="shortJson(b.input)"></span></div></template>
                <template x-if="b.type==='tool_result'"><div class="mono muted" :class="isError(b)?'':''">↳ <span x-text="resultText(b)"></span></div></template>
              </div>
            </template>
          </div>
        </div>
      </template>
      <template x-if="chatMessages.length===0"><p class="muted">No messages yet.</p></template>
      <template x-if="chatLoading"><p class="muted">Loading…</p></template>
    </div>
    <div class="chat-foot">
      <div style="display:flex;gap:.5rem">
        <input type="text" x-model="draft" @keydown.enter="send()" placeholder="Send a message…" :disabled="!canSend">
        <button @click="send()" :disabled="!canSend || !draft.trim()">Send</button>
      </div>
      <template x-if="sendError"><small class="muted">⚠ <span x-text="sendError"></span> — use “Open” to resume in terminal.</small></template>
    </div>
  </div>
</main>

<script>
function dashboard() {
  return {
    sessions: [], chatOpen: false, chatSessionId: null, chatSession: null,
    chatMessages: [], chatLoading: false, draft: '', sendError: '', canSend: true,
    hideTrivial: localStorage.getItem('hideTrivial')==='1',
    hideFailed: localStorage.getItem('hideFailed')!=='0',
    dark: localStorage.getItem('theme')!=='light',
    sseOk: false, _sse: null, _poll: null, _seenIds: new Set(),

    init() {
      this.$watch('hideTrivial', v => localStorage.setItem('hideTrivial', v?'1':'0'));
      this.$watch('hideFailed', v => localStorage.setItem('hideFailed', v?'1':'0'));
      this.$watch('dark', v => { localStorage.setItem('theme', v?'dark':'light'); document.documentElement.dataset.theme = v?'dark':'light'; });
      document.documentElement.dataset.theme = this.dark?'dark':'light';
      this.connectSSE();
      this.refresh();
    },

    get sortedSessions() {
      const order = { running:0, stale:1, idle:2, failed:3, completed:4 };
      return [...this.sessions].sort((a,b) => {
        const sa = order[this.displayStatus(a)] ?? 9, sb = order[this.displayStatus(b)] ?? 9;
        if (sa !== sb) return sa - sb;
        return (b.updatedAt||0) - (a.updatedAt||0);
      });
    },

    displayStatus(s) {
      const st = s.status || 'idle';
      if (st === 'running' && s._stale === true) return 'stale';
      return st;
    },
    titleOf(s) {
      let t = s.metadata && s.metadata.title;
      if (!t) { const m = (s._firstUser||'').trim(); t = m ? m.slice(0,80) : '(no title)'; }
      return t.length > 80 ? t.slice(0,80)+'…' : t;
    },
    projOf(s) { try { const h = s.cwd || ''; const r = h.replace(new RegExp('^'+require_home()), '~'); return r || '—'; } catch(e){ return s.cwd||'—'; } },
    costOf(s) { const c = s.metadata && s.metadata.totalCost; return (c==null||c===0)?'—':('$'+Number(c).toFixed(3)); },
    relTime(s) { const t = s.createdAt||s.updatedAt; if (!t) return '—'; return relFmt(t); },
    isTrivial(s) {
      const t = ((s.metadata&&s.metadata.title)||s._firstUser||'').toLowerCase();
      if (!t) return false;
      const clean = t.replace(/^<user_input[^>]*>/,'').replace(/<\/user_input>$/,'').trim();
      if (!clean) return false;
      if (clean.split(/\s+/).length <= 1) return true;
      return ['test','exit','quit','hello','help','hi','hey','ok','stop'].includes(clean);
    },

    upsert(s) {
      const i = this.sessions.findIndex(x => x.sessionId === s.sessionId);
      if (i >= 0) this.sessions.splice(i,1,{...this.sessions[i], ...s});
      else { this.sessions.push(s); this._seenIds.add(s.sessionId); }
    },
    remove(id) { this.sessions = this.sessions.filter(x => x.sessionId !== id); },

    connectSSE() {
      try { if (this._sse) this._sse.close(); } catch(e){}
      const es = new EventSource('/api/events');
      this._sse = es;
      es.onopen = () => { this.sseOk = true; if (this._poll) { clearInterval(this._poll); this._poll = null; } };
      es.onerror = () => { this.sseOk = false; es.close(); if (!this._poll) this._poll = setInterval(()=>this.refresh(), 5000); };
      es.onmessage = (ev) => {
        try { const e = JSON.parse(ev.data);
          if (e.type==='session.created'||e.type==='session.updated') this.upsert(e.session);
          else if (e.type==='session.detached') this.remove(e.sessionId);
          else if (e.type==='message.new') { if (e.sessionId===this.chatSessionId) this.chatMessages.push(e.message); }
        } catch(_){}
      };
    },

    async refresh() {
      try { const r = await fetch('/api/sessions'); const d = await r.json();
        this.sessions = Array.isArray(d)?d:(d.sessions||[]); this.sseOk = true; }
      catch(e){ this.sseOk = false; }
    },

    async openChat(id) {
      this.chatOpen = true; this.chatSessionId = id;
      this.chatSession = this.sessions.find(s=>s.sessionId===id) || null;
      this.chatMessages = []; this.chatLoading = true; this.sendError = '';
      try { const r = await fetch('/api/messages/'+encodeURIComponent(id));
        if (r.ok) { const d = await r.json(); this.chatMessages = d.messages||[]; } }
      catch(e){} finally { this.chatLoading = false; this.$nextTick(()=>this.scrollChat()); }
    },
    closeChat() { this.chatOpen=false; this.chatSessionId=null; this.chatMessages=[]; },
    scrollChat() { const el=this.$refs.chatbody; if (el) el.scrollTop = el.scrollHeight; },

    async send() {
      const text = this.draft.trim(); if (!text) return;
      this.draft=''; this.sendError=''; this.canSend=false;
      try { const r = await fetch('/api/send/'+encodeURIComponent(this.chatSessionId), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
        if (!r.ok) { const e=await r.json().catch(()=>({})); this.sendError = e.error||('HTTP '+r.status); } }
      catch(e){ this.sendError = e.message; }
      finally { this.canSend=true; }
    },

    async openTerminal(id) {
      try { await fetch('/api/open/'+encodeURIComponent(id), {method:'POST'}); }
      catch(e){ alert('Open failed: '+e.message); }
    },

    roleOf(m){ return m.role||'assistant'; },
    blocksOf(m){ return Array.isArray(m.content)?m.content:(typeof m.content==='string'?[{type:'text',text:m.content}]:[]); },
    shortJson(x){ try { return JSON.stringify(x).slice(0,120); } catch(e){ return ''; } },
    isError(b){ return !!(b.is_error||b.error); },
    resultText(b){ if (typeof b.content==='string') return b.content.slice(0,200); if (Array.isArray(b.content)) return (b.content.map(c=>c.text||'').join(' ')).slice(0,200); return ''; },
  };
}
function require_home(){ return (window.__HOME__||'/Users/').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function relFmt(ms){ const d=Date.now()-ms; if (d<60000) return 'just now'; if (d<3600000) return Math.floor(d/60000)+'m ago'; if (d<86400000) return Math.floor(d/3600000)+'h ago'; return Math.floor(d/86400000)+'d ago'; }
window.__HOME__ = window.__HOME__ || '';
setInterval(()=>{ const ev=new Event('x-tick'); document.dispatchEvent(ev); }, 30000);
</script>
</body>
</html>
